<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        body { background-color: black; color:white;  
                font-family: "Lato", sans-serif; }
        
        .btn {    
            display: inline-block;
            cursor: pointer;
            padding: 0.75rem 0.75rem;
            font-size: 1.5rem;
            font-weight: 400;
            color: white;
            text-align: center;
            text-decoration: none; 
            cursor: pointer;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
            border: thin solid #495057;
            border-radius: 0.5rem;
            background-color: #6c757d;    
            &:hover { background-color: #232323; border-color: black;}
        }

        #mainTitle {
            text-transform: uppercase;
        }

        .input {
            display: block;
            width: 70%;
            padding: .375rem .75rem;
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.5;
            color: black;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;            
            background-clip: padding-box;
            border:  thin solid #495057;
            border-radius: 0.5rem;
            transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;            
        }

        #txtTitle{ width: 50%; }
        .txtTopic {
            height: 3em;
            margin-top: 3px;
            margin-bottom: 3px;
        }

        #marqueeForm { margin-left: 5px;}        
        .btnDelTopic {  height: 50%;
                        border-radius: 0rem !important;
                        padding: 5px;
                        margin-top: 6px;
                        background-color: orangered;
                        border-color: orangered;
                    &:hover{ background-color: red; border-color: red;}}

 

        .flex { display: flex;}
        </style>
</head>
<body>
    <marquee>
        <div id="mainTitle">Default title:</div>
        <div id="mainMarquee"> First Topic </div>
    </marquee>

    <hr/>


    <form id="marqueeForm" name="marqueeForm">
        <div id="title" class="flex">
            <input type="text" id="txtTitle" name="txtTitle" class="input" placeholder="Main Title">
            <button type="button" id="btnAddTopic" name="btnAddTopic" class="btn" alt="Add topic">+</button>
        </div>
        <div id="topics">
            <div class="flex topic">
                <input type="text" id="txtMarquee" name="txtMarquee" class="input txtTopic" placeholder="Topic">
                <!-- <button id="btnDelTopic" name="btnDeltopic" class="btn" alt="Remove topic">x</button>  -->
            </div>
        </div>
        <button type="button" class="btn" id="btnSetMarquee" > Send </button>
        
    </form>


</body>

    <script>

       loadData()

               
        /*
           Function: loadData()
           This funcion load all data from localstorage to form and marquee         
        */
        function loadData(){
                        
            let mainTitle =(localStorage.getItem("mainTitle") === null)? "" : localStorage.getItem("mainTitle");
            let marquee =  (localStorage.getItem("marquee") === null)? "" : localStorage.getItem("marquee");
                marquee = marquee.split(",");

            //Loading to marquee
            document.getElementById("mainTitle").innerHTML = mainTitle;
            document.getElementById("mainMarquee").innerHTML = marquee;

            //Load to form
            document.getElementById("txtTitle").value = mainTitle;//Value for main title 
            document.getElementById("txtMarquee").value = marquee;//Value for themes
        }
        
        /*
           Function: setMarqueeValues()
           This function saves all data from forms to localstorage
        */
        function setMarqueeValues() {

            let mainTitle = document.getElementById("txtTitle").value;//Value for main title 
            let marquee = getAllTopics();// document.getElementById("txtMarquee").value;//Value for themes

            localStorage.setItem("mainTitle", mainTitle);
            localStorage.setItem("marquee", marquee);

            loadData();
        }   

        //Handle the form event
        let form = document.getElementById("marqueeForm");
        form.addEventListener('submit', function(event){
            event.preventDefault(); 
            setMarqueeValues();
        });

        //Handle button click
        const btn = document.getElementById('btnSetMarquee');
        btn.addEventListener('click', function(){
            setMarqueeValues();
        });

        const btnAddTopic = document.getElementById('btnAddTopic');
        btnAddTopic.addEventListener('click', function(){            
            addTopic()
        });
 

        function addTopic(){
           const topics = document.getElementById("topics");
               
           let topic = `<div class="flex topic"><input type="text" class="input txtTopic" placeholder="Topic"> 
                        <button class="btn btnDelTopic" alt="Remove topic" onclick="deleteTopic(this)">x</button></div>`;
 
               topics.insertAdjacentHTML('beforeend', topic);             
        }

        function getAllTopics(){
            const allTopics = document.getElementsByClassName("topic");
            let aTopics = []; //Array

            for(let i=0; i<allTopics.length;i++){ //Classic Style
                if(allTopics[i].children[0].value !== "")
                    aTopics.push(allTopics[i].children[0].value)
            }

          return aTopics;
        }

        function deleteTopic(el) {
            el.closest('.topic').remove();
            console.log(">>>");
            getAllTopics();
        }

    </script>
</html>
